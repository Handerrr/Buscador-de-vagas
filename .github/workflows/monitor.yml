name: Coletar vagas

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: job-monitor-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    if: ${{ vars.MONITOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      JOB_TITLES: ${{ vars.JOB_TITLES }}
      JOB_INCLUDED_KEYWORDS: ${{ vars.JOB_INCLUDED_KEYWORDS }}
      JOB_EXCLUDED_KEYWORDS: ${{ vars.JOB_EXCLUDED_KEYWORDS }}
      JOB_LOCATIONS: ${{ vars.JOB_LOCATIONS }}
      JOB_LEVELS: ${{ vars.JOB_LEVELS }}
      JOB_PREFERRED_KEYWORDS: ${{ vars.JOB_PREFERRED_KEYWORDS }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Validar configuração obrigatória
        shell: bash
        run: |
          test -n "$DATABASE_URL"
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          test -n "$JOB_TITLES"
          test -n "$JOB_LOCATIONS"
          test -n "$JOB_LEVELS"
          test -n "$JOB_PREFERRED_KEYWORDS"

      - name: Executar o monitor
        run: python -m job_monitor.main
